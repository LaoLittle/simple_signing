[package]
name = "signing"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
prost = "0.14"
md-5 = { version = "0.11", default-features = false }
rc4 = { version = "0.2", default-features = false }
chacha20 = { version = "0.10", features = ["legacy"] }
crc32fast = "1"
rand_core = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
getrandom = { version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
hex = { version = "0.4" }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
